services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
      UPLOADS_DIR: /uploads
    volumes:
      - ./_OUTPUT:/output
      - ./_UPLOADS:/uploads # videos (uploaded, or copied in)
      - ./_COMMON/_MODELS/MOBILESAM:/models:ro # MobileSAM ONNX (scripts/fetch_models.py)
      - ./_CACHE:/cache # MobileSAM embedding cache
      - ./server.py:/app/server.py # dev live-reload
      - ./sam_service.py:/app/sam_service.py
      - ./library.py:/app/library.py
      - ./static:/app/static
