services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      VIDEOS_DIR: /videos
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
    volumes:
      - ../_VIDEOS_COMMON:/videos:ro # real workspace dir, not the repo symlink
      - ./_OUTPUT:/output
      - ../_MODELS/MOBILESAM:/models:ro # MobileSAM ONNX (_COMMON/_MODELS/MOBILESAM; real dir)
      - ./_CACHE:/cache # MobileSAM embedding cache
      - ./server.py:/app/server.py # dev live-reload
      - ./sam_service.py:/app/sam_service.py
      - ./static:/app/static
