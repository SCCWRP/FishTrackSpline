<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishTrackSpline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="layout">
    <section class="left">
      <div class="stage" id="stage">
        <video id="video" muted playsinline preload="auto"></video>
        <canvas id="overlay"></canvas>
        <div class="stage-hint" id="stageHint">Click on the video to add a point for the active object</div>
      </div>
      <div class="transport">
        <button id="playBtn" title="Play/Pause (Space)">▶</button>
        <button id="stepBack" title="Step back 1 frame (←)">⟨</button>
        <button id="stepFwd" title="Step forward 1 frame (→)">⟩</button>
        <input type="range" id="scrubber" min="0" max="0" step="0.001" value="0" />
        <span class="time-readout" id="timeReadout">0:00.00 / 0:00.00</span>
        <select id="rateSelect" title="Playback rate">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <header class="panel-header">
          <h2>Objects</h2>
          <button id="addObjectBtn">＋ Add object</button>
        </header>
        <ul class="object-list" id="objectList"></ul>
      </section>

      <section class="panel panel-grow">
        <header class="panel-header">
          <h2 id="pointsCaption">Points</h2>
        </header>
        <div class="table-wrap">
          <table class="points-table">
            <thead>
              <tr><th>time (s)</th><th>x</th><th>y</th><th></th></tr>
            </thead>
            <tbody id="pointsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <header class="panel-header">
          <h2>Export</h2>
        </header>
        <div class="export-buttons">
          <button id="saveOutputBtn" title="Write JSON + CSV into _OUTPUT/ on the server">Save to _OUTPUT</button>
          <button id="downloadBtn" title="Download JSON + CSV in the browser">Download</button>
        </div>
        <div class="export-status" id="exportStatus"></div>
      </section>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
